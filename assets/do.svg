<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="706" viewBox="0 0 1280 706"><style>@font-face{font-family:'serift';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'reg';src:url(data:font/woff2;base64,) format('woff2');}</style><defs></defs><text x="18.0" y="58.0" font-family="serift" font-size="40" fill="#F3EEE8" text-anchor="start" letter-spacing="-0.3" >Automation</text><text x="360.0" y="52.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >Pipelines that do the boring part for me: record, transcribe,</text><text x="360.0" y="88.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >summarise, check, remind. They run on my own server every day,</text><text x="360.0" y="124.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >whether I look at them or not.</text><rect x="4" y="162" width="1272" height="1" fill="#1C1C1C"/><text x="18.0" y="220.0" font-family="serift" font-size="40" fill="#F3EEE8" text-anchor="start" letter-spacing="-0.3" >Apps</text><text x="360.0" y="214.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >Flutter and Kotlin. Exact alarms, home-screen widgets, background</text><text x="360.0" y="250.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >jobs, and a screen-time coach that actually interrupts me.</text><rect x="4" y="288" width="1272" height="1" fill="#1C1C1C"/><text x="18.0" y="346.0" font-family="serift" font-size="40" fill="#F3EEE8" text-anchor="start" letter-spacing="-0.3" >Web</text><text x="360.0" y="340.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >Next.js and TypeScript up front, FastAPI or Node with Postgres</text><text x="360.0" y="376.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >behind, Nginx in front of all of it.</text><rect x="4" y="414" width="1272" height="1" fill="#1C1C1C"/><text x="18.0" y="472.0" font-family="serift" font-size="40" fill="#F3EEE8" text-anchor="start" letter-spacing="-0.3" >Under the hood</text><text x="360.0" y="466.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >I like knowing how things work at the bottom: APK internals, ADB,</text><text x="360.0" y="502.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >Android system packages, a 4-bit CPU built from logic gates in</text><text x="360.0" y="538.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >Logisim and Verilog.</text><rect x="4" y="576" width="1272" height="1" fill="#1C1C1C"/><text x="18.0" y="634.0" font-family="serift" font-size="40" fill="#F3EEE8" text-anchor="start" letter-spacing="-0.3" >Renders</text><text x="360.0" y="628.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >Blender and numpy when a picture is needed, including the red knot</text><text x="360.0" y="664.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >at the top of this page.</text></svg>
cing="0.0" >purpose: without it, diagnostics</text><text x="46.0" y="331.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >relaunch every second and cook the</text><text x="46.0" y="366.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >phone.</text><text x="46.0" y="414.0" font-family="reg" font-size="19" fill="#D8D2CC" text-anchor="start" letter-spacing="0.0" >ADB</text><text x="103.6" y="414.0" font-family="reg" font-size="19" fill="#FF2436" text-anchor="start" letter-spacing="0.0" >/</text><text x="126.6" y="414.0" font-family="reg" font-size="19" fill="#D8D2CC" text-anchor="start" letter-spacing="0.0" >PowerShell</text><text x="260.9" y="414.0" font-family="reg" font-size="19" fill="#FF2436" text-anchor="start" letter-spacing="0.0" >/</text><text x="283.8" y="414.0" font-family="reg" font-size="19" fill="#D8D2CC" text-anchor="start" letter-spacing="0.0" >Android 16</text><text x="46.0" y="526.0" font-family="serifm" font-size="80" fill="url(#lak)" text-anchor="start" letter-spacing="-1.5" >60</text><text x="49.0" y="564.0" font-family="reg" font-size="18" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >packages gone, one command to undo</text><rect x="1" y="1" width="628" height="606" rx="28" fill="none" stroke="url(#kr)" stroke-width="1.5"/></svg>
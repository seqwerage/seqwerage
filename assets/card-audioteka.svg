<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="630" height="608" viewBox="0 0 630 608"><style>@font-face{font-family:'serifm';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'reg';src:url(data:font/woff2;base64,) format('woff2');}</style><defs><linearGradient id="lak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8C93"/><stop offset="0.38" stop-color="#FF2436"/><stop offset="0.62" stop-color="#C8001C"/><stop offset="1" stop-color="#6E000F"/></linearGradient><radialGradient id="gl" cx="1.0" cy="0.0" r="0.75"><stop offset="0" stop-color="#FF2436" stop-opacity="0.20"/><stop offset="0.45" stop-color="#FF2436" stop-opacity="0.05"/><stop offset="1" stop-color="#FF2436" stop-opacity="0"/></radialGradient><linearGradient id="kr" x1="1.0" y1="0.0" x2="0.0" y2="1.0"><stop offset="0" stop-color="#7A1520"/><stop offset="0.35" stop-color="#1C1C1C"/><stop offset="1" stop-color="#1C1C1C"/></linearGradient></defs><rect x="1" y="1" width="628" height="606" rx="28" fill="#000000"/><rect x="1" y="1" width="628" height="606" rx="28" fill="url(#gl)"/><text x="46.0" y="100.0" font-family="serifm" font-size="62" fill="#F3EEE8" text-anchor="start" letter-spacing="-1.2" >Audioteka</text><text x="46.0" y="156.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >My music library, rebuilt around 3,035</text><text x="46.0" y="191.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >liked tracks. Tracklists come from</text><text x="46.0" y="226.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >Deezer, and a detector rejects</text><text x="46.0" y="261.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >censored “clean” versions by finding</text><text x="46.0" y="296.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >muted gaps and 1 kHz bleeps in the</text><text x="46.0" y="331.0" font-family="reg" font-size="23" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >waveform.</text><text x="46.0" y="379.0" font-family="reg" font-size="19" fill="#D8D2CC" text-anchor="start" letter-spacing="0.0" >Python</text><text x="136.1" y="379.0" font-family="reg" font-size="19" fill="#FF2436" text-anchor="start" letter-spacing="0.0" >/</text><text x="159.0" y="379.0" font-family="reg" font-size="19" fill="#D8D2CC" text-anchor="start" letter-spacing="0.0" >numpy</text><text x="244.3" y="379.0" font-family="reg" font-size="19" fill="#FF2436" text-anchor="start" letter-spacing="0.0" >/</text><text x="267.2" y="379.0" font-family="reg" font-size="19" fill="#D8D2CC" text-anchor="start" letter-spacing="0.0" >Deezer API</text><text x="398.8" y="379.0" font-family="reg" font-size="19" fill="#FF2436" text-anchor="start" letter-spacing="0.0" >/</text><text x="421.7" y="379.0" font-family="reg" font-size="19" fill="#D8D2CC" text-anchor="start" letter-spacing="0.0" >rclone</text><text x="46.0" y="501.0" font-family="serifm" font-size="80" fill="url(#lak)" text-anchor="start" letter-spacing="-1.5" >16</text><path d="M141 473 h44 m-12 -10 l12 10 l-12 10" fill="none" stroke="#FF2436" stroke-width="2.2"/><text x="203.3" y="501.0" font-family="serifm" font-size="80" fill="url(#lak)" text-anchor="start" letter-spacing="-1.5" >1</text><text x="49.0" y="539.0" font-family="reg" font-size="18" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >false alarms on real music after tuning the bleep</text><text x="49.0" y="564.0" font-family="reg" font-size="18" fill="#A9A39D" text-anchor="start" letter-spacing="0.0" >detector</text><rect x="1" y="1" width="628" height="606" rx="28" fill="none" stroke="url(#kr)" stroke-width="1.5"/></svg>